[env]
monitor_speed = 115200
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0
monitor_filters = esp32_exception_decoder, default
monitor_dtr = 1
monitor_rts = 1

; Exact revisions from the previously verified successful build.
; Use full 40-character commit IDs. Older Git/PlatformIO combinations cannot
; shallow-fetch an abbreviated SHA as a remote ref.
platform = https://github.com/pioarduino/platform-espressif32.git#dd01e49e4695933bc29c1bf6be9a19a6572527a6
framework = arduino
lib_deps =
    https://github.com/Links2004/arduinoWebSockets.git#e3edca4907e8524856fbc38a6bb00eb6073c982e
    lovyan03/LovyanGFX@1.2.26

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

[env:wroom-n16r8-wav-both]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_build.partitions = boards/partitions/partitions_16MB_10MB_FS.csv
board_build.filesystem = littlefs
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
